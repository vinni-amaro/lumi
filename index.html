<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumi — prototype</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: #000;
    height: 100%;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    gap: 24px;
    padding: 24px 0 48px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: #1c1c1e;
    padding: 4px;
    border-radius: 12px;
  }
  .tab-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: #9b9b9b;
    font-size: 15px;
    font-weight: 600;
    padding: 8px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.is-active {
    background: #fff;
    color: #111;
  }

  .frame-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  iframe {
    width: 426px;
    height: 898px;
    border: none;
    display: none;
  }
  iframe.is-active {
    display: block;
  }
</style>
</head>
<body>

<div class="page">
  <div class="tabs">
    <button class="tab-btn is-active" data-target="v1" onclick="showTab('v1')">v1</button>
    <button class="tab-btn" data-target="v2" onclick="showTab('v2')">v2</button>
    <button class="tab-btn" data-target="v3" onclick="showTab('v3')">v3</button>
  </div>

  <div class="frame-wrap">
    <iframe id="frame-v1" class="is-active" src="v1.html"></iframe>
    <iframe id="frame-v2" src="v2.html"></iframe>
    <iframe id="frame-v3" src="v3.html"></iframe>
  </div>
</div>

<script>
  function showTab(target) {
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.classList.toggle("is-active", btn.dataset.target === target);
    });
    document.querySelectorAll("iframe").forEach((frame) => {
      frame.classList.toggle("is-active", frame.id === `frame-${target}`);
    });
  }
</script>

</body>
</html>
